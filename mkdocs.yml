site_name: OrigamiTasks Documentation
site_description: Open-source Linux workflow automation control plane
site_url: https://maxime3d77.github.io/OrigamiTasks/
repo_url: https://github.com/Maxime3d77/OrigamiTasks
repo_name: Maxime3d77/OrigamiTasks
docs_dir: docs/site
site_dir: site
strict: true
nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Workflows: workflows.md
  - Task reference: tasks.md
  - Integrations: integrations.md
  - Proxmox & DR: proxmox.md
  - PBS backup pilot: pra-pbs-pilot.md
  - Direct SSH VM seed (no PBS): pra-direct-seed.md
  - Offline incremental and per-VM tracking: pra-incremental-cold.md
  - Integrated Linux PRA agent: pra-agent-integrated.md
  - Live PRA QMP compatibility: pra-hot-replication.md
  - Agents: agents.md
  - Operations & Upgrades: operations.md
  - Security: security.md
  - API: api.md
  - Troubleshooting: troubleshooting.md
  - Feature roadmap: roadmap.md
  - Changelog: changelog.md
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  language: en
  palette:
    - scheme: slate
      primary: amber
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light theme
    - scheme: default
      primary: amber
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark theme
  features:
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - content.code.copy
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
        - locale: fr
          name: Français
          nav_translations:
            Home: Accueil
            Installation: Installation
            Configuration: Configuration
            Workflows: Workflows
            Task reference: Catalogue des tâches
            Integrations: Intégrations
            Proxmox & DR: Proxmox et PRA
            PBS backup pilot: Pilote de sauvegarde PBS
            Direct SSH VM seed (no PBS): Copie directe SSH sans PBS
            Offline incremental and per-VM tracking: Incrémental à froid et suivi par VM
            Integrated Linux PRA agent: Module PRA intégré à l'agent
            Live PRA QMP compatibility: Prétest PRA à chaud QMP
            Agents: Agents
            Operations & Upgrades: Exploitation et mises à jour
            Security: Sécurité
            API: API
            Troubleshooting: Dépannage
            Feature roadmap: Fonctionnalités prévues
            Changelog: Historique
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
