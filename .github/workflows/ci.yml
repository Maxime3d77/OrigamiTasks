name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and documentation dependencies
        run: python -m pip install -r requirements.txt -r requirements-docs.txt pytest
      - name: Run API and integration tests
        run: node --check static/app.js && node --check static/login.js && node tests/login_smoke.cjs && python -m compileall -q app agents/linux && python -m pytest -q
      - name: Verify bilingual documentation parity and task coverage
        run: python tools/check_docs.py
      - name: Build bilingual documentation (strict)
        run: mkdocs build --strict

  pra-qmp-e2e:
    name: Real QEMU QMP/NBD full + incremental smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real QEMU block tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils
      - name: Exercise actual QMP dirty bitmap backups over local NBD
        run: python tests/pra_qmp_e2e_lab.py
      - name: Validate QCOW2 COW chains on real block devices (loop-backed, disposable)
        run: |
          sudo modprobe loop || true
          sudo python tests/pra_qcow2_on_loop_lab.py
