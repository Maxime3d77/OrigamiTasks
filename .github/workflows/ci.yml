name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and documentation dependencies
        run: python -m pip install -r requirements.txt -r requirements-docs.txt pytest
      - name: Run API and integration tests
        run: python -m compileall -q app && python -m pytest -q
      - name: Verify bilingual documentation parity and task coverage
        run: python tools/check_docs.py
      - name: Build bilingual documentation (strict)
        run: mkdocs build --strict
